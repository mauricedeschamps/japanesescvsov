<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Sentence Maker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='red'/></svg>">
    <style>
        :root {
            --bg: #121212;
            --text: #e0e0e0;
            --card: #1e1e1e;
            --border: #444;
            --primary: #4CAF50;
            --secondary: #2196F3;
            --accent: #FF9800;
            --particle: #FF5252;
        }
        .light-mode {
            --bg: #ffffff;
            --text: #333333;
            --card: #f8f9fa;
            --border: #dee2e6;
            --primary: #007bff;
            --secondary: #6c757d;
            --accent: #fd7e14;
            --particle: #dc3545;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 10px;
            line-height: 1.6;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 60px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 1.5rem;
            margin: 0;
            color: var(--primary);
        }
        .controls {
            display: flex;
            gap: 10px;
        }
        button {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            color: var(--text);
            transition: all 0.3s;
        }
        .mode-toggle {
            background: var(--primary);
            color: white;
        }
        .builder {
            background: var(--card);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            transition: all 0.3s;
        }
        select, input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--card);
            color: var(--text);
            transition: all 0.3s;
        }
        .sentence-type {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }
        .sentence-type button {
            flex: 1;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            padding: 8px;
            color: var(--text);
            cursor: pointer;
        }
        .sentence-type button.active {
            border-bottom: 2px solid var(--accent);
            font-weight: bold;
            color: var(--accent);
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: var(--card);
            border-radius: 8px;
            min-height: 100px;
            border: 1px solid var(--border);
            transition: all 0.3s;
        }
        .japanese {
            font-size: 1.2rem;
            margin-bottom: 5px;
            color: var(--text);
            line-height: 1.8;
        }
        .japanese .particle {
            color: var(--particle);
            font-weight: bold;
        }
        .english {
            color: var(--secondary);
            font-style: italic;
        }
        .hidden {
            display: none;
        }
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card);
            padding: 10px;
            text-align: center;
            border-top: 1px solid var(--border);
            font-size: 0.8rem;
            transition: all 0.3s;
        }
        .footer a {
            color: var(--primary);
            text-decoration: none;
        }
        .subject-options, .complement-options, .object-options {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .subject-option, .complement-option, .object-option {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            background: var(--card);
            border: 1px solid var(--border);
            transition: all 0.3s;
        }
        .subject-option.selected, .complement-option.selected, .object-option.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .adjective-space {
            margin-right: 5px;
        }
        .custom-input {
            margin-top: 10px;
        }
        .custom-input label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        .hint {
            font-size: 0.8rem;
            color: var(--secondary);
            margin-top: -5px;
            margin-bottom: 10px;
        }
        .tense-options {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .tense-option {
            flex: 1;
            text-align: center;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            background: var(--card);
            border: 1px solid var(--border);
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        .tense-option.selected {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .verb-note {
            font-size: 0.8rem;
            color: var(--secondary);
            font-style: italic;
            margin-top: -8px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Japanese Sentence Maker</h1>
            <div class="controls">
                <button class="mode-toggle" id="darkMode">Light</button>
                <button id="langToggle">EN</button>
            </div>
        </div>
        
        <div class="sentence-type">
            <button class="active" data-type="scv">SはCです</button>
            <button data-type="sov">SはOをV</button>
        </div>
        
        <div class="builder">
            <!-- Subject Section -->
            <div class="subject-options">
                <div class="subject-option selected" data-type="proper">Proper Noun</div>
                <div class="subject-option" data-type="pronoun">Pronoun</div>
            </div>
            
            <div id="proper-noun-section">
                <div class="custom-input">
                    <label for="customSubject">Enter subject:</label>
                    <input type="text" id="customSubject" placeholder="e.g. たなか">
                </div>
            </div>
            
            <div id="pronoun-section" class="hidden">
                <select id="subject">
                    <option value="わたし/watashi/I">わたし (I)</option>
                    <option value="あなた/anata/You">あなた (You)</option>
                    <option value="かれ/kare/He">かれ (He)</option>
                    <option value="かのじょ/kanojo/She">かのじょ (She)</option>
                    <option value="わたしたち/watashitachi/We">わたしたち (We)</option>
                    <option value="あなたたち/anatatachi/You (plural)">あなたたち (You all)</option>
                    <option value="かれら/karera/They (male)">かれら (They - male)</option>
                    <option value="かのじょら/kanojora/They (female)">かのじょら (They - female)</option>
                    <option value="これ/kore/This">これ (This)</option>
                    <option value="それ/sore/That">それ (That)</option>
                    <option value="あれ/are/That (over there)">あれ (That over there)</option>
                </select>
            </div>
            
            <!-- Complement Section -->
            <div id="complement-section">
                <div class="complement-options">
                    <div class="complement-option selected" data-type="adjective">Adjective</div>
                    <div class="complement-option" data-type="noun">Noun</div>
                </div>
                
                <div id="adjective-complement-section">
                    <div class="custom-input">
                        <label for="customAdjective">Enter adjective:</label>
                        <input type="text" id="customAdjective" placeholder="e.g. うれしい">
                    </div>
                    <div class="hint">Or select from common adjectives:</div>
                    <select id="adjective-complement">
                        <option value="うれしい/ureshii/happy">うれしい (happy)</option>
                        <option value="かなしい/kanashii/sad">かなしい (sad)</option>
                        <option value="たのしい/tanoshii/fun">たのしい (fun)</option>
                        <option value="おいしい/oishii/delicious">おいしい (delicious)</option>
                        <option value="げんき/genki/energetic">げんき (energetic)</option>
                        <option value="いい/ii/good">いい (good)</option>
                        <option value="わるい/warui/bad">わるい (bad)</option>
                        <option value="おおきい/ookii/big">おおきい (big)</option>
                        <option value="ちいさい/chiisai/small">ちいさい (small)</option>
                        <option value="たかい/takai/expensive">たかい (expensive)</option>
                        <option value="やすい/yasui/cheap">やすい (cheap)</option>
                        <option value="ながい/nagai/long">ながい (long)</option>
                        <option value="みじかい/mijikai/short">みじかい (short)</option>
                        <option value="はやい/hayai/fast">はやい (fast)</option>
                        <option value="おそい/osoi/slow">おそい (slow)</option>
                        <option value="あつい/atsui/hot">あつい (hot)</option>
                        <option value="さむい/samui/cold">さむい (cold)</option>
                        <option value="むずかしい/muzukashii/difficult">むずかしい (difficult)</option>
                        <option value="やさしい/yasashii/easy">やさしい (easy)</option>
                        <option value="おもしろい/omoshiroi/interesting">おもしろい (interesting)</option>
                    </select>
                </div>
                
                <div id="noun-complement-section" class="hidden">
                    <div class="custom-input">
                        <label for="customNounComplement">Enter noun:</label>
                        <input type="text" id="customNounComplement" placeholder="e.g. がくせい">
                    </div>
                </div>
            </div>
            
            <!-- Verb Section for SCV -->
            <div id="scv-verb-section">
                <div class="tense-options">
                    <div class="tense-option selected" data-tense="past">Past</div>
                    <div class="tense-option" data-tense="present">Present</div>
                    <div class="tense-option" data-tense="future">Future</div>
                </div>
                
                <select id="scv-verb">
                    <!-- Past Tense -->
                    <option value="でした/deshita/be" data-tense="past" data-type="affirmative">でした (be)。</option>
                    <option value="ではありませんでした/dewa arimasen deshita/be not" data-tense="past" data-type="negative">ではありませんでした (be not)。</option>
                    <option value="でしたか/deshita ka/be" data-tense="past" data-type="question">でしたか？ (be?)</option>
                    
                    <!-- Present Tense -->
                    <option value="です/desu/be" data-tense="present" data-type="affirmative">です (be)。</option>
                    <option value="ではありません/dewa arimasen/be not" data-tense="present" data-type="negative">ではありません (be not)。</option>
                    <option value="ですか/desu ka/be" data-tense="present" data-type="question">ですか？ (be?)</option>
                    
                    <!-- Future Tense -->
                    <option value="でしょう/deshou/will be" data-tense="future" data-type="affirmative">でしょう (will be)。</option>
                    <option value="ではないでしょう/dewa nai deshou/will not be" data-tense="future" data-type="negative">ではないでしょう (will not be)。</option>
                    <option value="でしょうか/deshou ka/will be" data-tense="future" data-type="question">でしょうか？ (will be?)</option>
                </select>
            </div>
            
            <!-- Object Section for SOV -->
            <div id="object-section" class="hidden">
                <div class="object-options">
                    <div class="object-option selected" data-type="person">Person</div>
                    <div class="object-option" data-type="thing">Thing</div>
                </div>
                
                <div id="person-object-section">
                    <div class="custom-input">
                        <label for="customPersonObject">Enter person:</label>
                        <input type="text" id="customPersonObject" placeholder="e.g. せんせい">
                    </div>
                    <div class="hint">Or select from pronouns:</div>
                    <select id="person-object">
                        <option value="わたし/watashi/me">わたし (me)</option>
                        <option value="あなた/anata/you">あなた (you)</option>
                        <option value="かれ/kare/him">かれ (him)</option>
                        <option value="かのじょ/kanojo/her">かのじょ (her)</option>
                        <option value="わたしたち/watashitachi/us">わたしたち (us)</option>
                        <option value="あなたたち/anatatachi/you (plural)">あなたたち (you all)</option>
                        <option value="かれら/karera/them (male)">かれら (them - male)</option>
                        <option value="かのじょら/kanojora/them (female)">かのじょら (them - female)</option>
                    </select>
                </div>
                
                <div id="thing-object-section" class="hidden">
                    <div class="custom-input">
                        <label for="customThingObject">Enter thing:</label>
                        <input type="text" id="customThingObject" placeholder="e.g. ほん">
                    </div>
                    <div class="hint">Or select common objects:</div>
                    <select id="thing-object">
                        <option value="ほん/hon/book">ほん (book)</option>
                        <option value="りんご/ringo/apple">りんご (apple)</option>
                        <option value="みず/mizu/water">みず (water)</option>
                        <option value="ケーキ/keeki/cake">ケーキ (cake)</option>
                        <option value="スマホ/sumaho/smartphone">スマホ (smartphone)</option>
                        <option value="メール/meeru/email">メール (email)</option>
                        <option value="えいご/eigo/English">えいご (English)</option>
                        <option value="にほんご/nihongo/Japanese">にほんご (Japanese)</option>
                        <option value="おんがく/ongaku/music">おんがく (music)</option>
                        <option value="えいが/eiga/movie">えいが (movie)</option>
                        <option value="しょくじ/shokuji/meal">しょくじ (meal)</option>
                        <option value="おさけ/osake/alcohol">おさけ (alcohol)</option>
                        <option value="コーヒー/koohii/coffee">コーヒー (coffee)</option>
                    </select>
                </div>
                
                <select id="sov-verb">
                    <option value="よみます/yomimasu/read" data-type="transitive">よみます (read)</option>
                    <option value="たべます/tabemasu/eat" data-type="transitive">たべます (eat)</option>
                    <option value="のみます/nomimasu/drink" data-type="transitive">のみます (drink)</option>
                    <option value="かいます/kaimasu/buy" data-type="transitive">かいます (buy)</option>
                    <option value="つくります/tsukurimasu/make" data-type="transitive">つくります (make)</option>
                    <option value="みます/mimasu/watch" data-type="transitive">みます (watch)</option>
                    <option value="ききます/kikimasu/listen" data-type="transitive">ききます (listen)</option>
                    <option value="かきます/kakimasu/write" data-type="transitive">かきます (write)</option>
                    <option value="はなします/hanashimasu/speak" data-type="transitive">はなします (speak)</option>
                    <option value="いきます/ikimasu/go" data-type="intransitive">いきます (go) [intransitive]</option>
                    <option value="きます/kimasu/come" data-type="intransitive">きます (come) [intransitive]</option>
                    <option value="ねます/nemasu/sleep" data-type="intransitive">ねます (sleep) [intransitive]</option>
                    <option value="おきます/okimasu/wake up" data-type="intransitive">おきます (wake up) [intransitive]</option>
                    <option value="べんきょうします/benkyou shimasu/study" data-type="transitive">べんきょうします (study)</option>
                    <option value="しごとします/shigoto shimasu/work" data-type="intransitive">しごとします (work) [intransitive]</option>
                </select>
                <div class="verb-note">[intransitive] = does not take an object (自動詞)</div>
            </div>
        </div>
        
        <div class="result">
            <div class="japanese" id="japanese"></div>
            <div class="english" id="english"></div>
        </div>
    </div>

    <div class="footer">
        Contact us<br>
        <a href="mailto:mementomorikatsu@gmail.com">mementomorikatsu@gmail.com</a>
    </div>

    <script>
        // 要素を取得
        const darkBtn = document.getElementById('darkMode');
        const langBtn = document.getElementById('langToggle');
        const sentenceTypeBtns = document.querySelectorAll('.sentence-type button');
        const subjectOptions = document.querySelectorAll('.subject-option');
        const complementOptions = document.querySelectorAll('.complement-option');
        const objectOptions = document.querySelectorAll('.object-option');
        const tenseOptions = document.querySelectorAll('.tense-option');
        const subject = document.getElementById('subject');
        const customSubject = document.getElementById('customSubject');
        const customAdjective = document.getElementById('customAdjective');
        const adjectiveComplement = document.getElementById('adjective-complement');
        const customNounComplement = document.getElementById('customNounComplement');
        const customPersonObject = document.getElementById('customPersonObject');
        const personObject = document.getElementById('person-object');
        const customThingObject = document.getElementById('customThingObject');
        const thingObject = document.getElementById('thing-object');
        const objectSection = document.getElementById('object-section');
        const personObjectSection = document.getElementById('person-object-section');
        const thingObjectSection = document.getElementById('thing-object-section');
        const scvVerb = document.getElementById('scv-verb');
        const sovVerb = document.getElementById('sov-verb');
        const scvVerbSection = document.getElementById('scv-verb-section');
        const complementSection = document.getElementById('complement-section');
        const japanese = document.getElementById('japanese');
        const english = document.getElementById('english');
        const body = document.body;
        
        // 初期設定
        let englishMode = false;
        let currentSentenceType = 'scv';
        let currentSubjectType = 'proper';
        let currentComplementType = 'adjective';
        let currentObjectType = 'person';
        let currentTense = 'past';
        
        // ダークモード切り替え
        darkBtn.addEventListener('click', () => {
            body.classList.toggle('light-mode');
            const isLight = body.classList.contains('light-mode');
            darkBtn.textContent = isLight ? 'Dark' : 'Light';
        });
        
        // 言語切り替え
        langBtn.addEventListener('click', () => {
            englishMode = !englishMode;
            langBtn.textContent = englishMode ? 'JP' : 'EN';
            updateSentence();
        });
        
        // 文型切り替え
        sentenceTypeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                sentenceTypeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSentenceType = btn.dataset.type;
                
                if (currentSentenceType === 'scv') {
                    complementSection.classList.remove('hidden');
                    objectSection.classList.add('hidden');
                    scvVerbSection.classList.remove('hidden');
                } else {
                    complementSection.classList.add('hidden');
                    objectSection.classList.remove('hidden');
                    scvVerbSection.classList.add('hidden');
                }
                
                updateSentence();
            });
        });
        
        // 主語タイプ切り替え
        subjectOptions.forEach(option => {
            option.addEventListener('click', () => {
                subjectOptions.forEach(opt => opt.classList.remove('selected'));
                option.classList.add('selected');
                currentSubjectType = option.dataset.type;
                
                if (currentSubjectType === 'proper') {
                    properNounSection.classList.remove('hidden');
                    pronounSection.classList.add('hidden');
                } else {
                    properNounSection.classList.add('hidden');
                    pronounSection.classList.remove('hidden');
                }
                
                updateSentence();
            });
        });
        
        // 補語タイプ切り替え
        complementOptions.forEach(option => {
            option.addEventListener('click', () => {
                complementOptions.forEach(opt => opt.classList.remove('selected'));
                option.classList.add('selected');
                currentComplementType = option.dataset.type;
                
                if (currentComplementType === 'adjective') {
                    adjectiveComplementSection.classList.remove('hidden');
                    nounComplementSection.classList.add('hidden');
                } else {
                    adjectiveComplementSection.classList.add('hidden');
                    nounComplementSection.classList.remove('hidden');
                }
                
                updateSentence();
            });
        });
        
        // 目的語タイプ切り替え
        objectOptions.forEach(option => {
            option.addEventListener('click', () => {
                objectOptions.forEach(opt => opt.classList.remove('selected'));
                option.classList.add('selected');
                currentObjectType = option.dataset.type;
                
                if (currentObjectType === 'person') {
                    personObjectSection.classList.remove('hidden');
                    thingObjectSection.classList.add('hidden');
                } else {
                    personObjectSection.classList.add('hidden');
                    thingObjectSection.classList.remove('hidden');
                }
                
                updateSentence();
            });
        });
        
        // 時制切り替え
        tenseOptions.forEach(option => {
            option.addEventListener('click', () => {
                tenseOptions.forEach(opt => opt.classList.remove('selected'));
                option.classList.add('selected');
                currentTense = option.dataset.tense;
                
                // 選択された時制に合う動詞のオプションを表示
                const verbOptions = scvVerb.querySelectorAll('option');
                verbOptions.forEach(opt => {
                    if (opt.dataset.tense === currentTense) {
                        opt.hidden = false;
                    } else {
                        opt.hidden = true;
                    }
                });
                
                // 最初のオプションを選択
                const firstVisibleOption = scvVerb.querySelector('option:not([hidden])');
                if (firstVisibleOption) {
                    scvVerb.value = firstVisibleOption.value;
                }
                
                updateSentence();
            });
        });
        
        // カスタム形容詞入力時に選択肢を無視
        customAdjective.addEventListener('input', () => {
            if (customAdjective.value.trim() !== '') {
                adjectiveComplement.disabled = true;
            } else {
                adjectiveComplement.disabled = false;
            }
            updateSentence();
        });
        
        // カスタム目的語入力時に選択肢を無視
        customPersonObject.addEventListener('input', () => {
            if (customPersonObject.value.trim() !== '') {
                personObject.disabled = true;
            } else {
                personObject.disabled = false;
            }
            updateSentence();
        });
        
        customThingObject.addEventListener('input', () => {
            if (customThingObject.value.trim() !== '') {
                thingObject.disabled = true;
            } else {
                thingObject.disabled = false;
            }
            updateSentence();
        });
        
        // 自動詞選択時に目的語を無視
        sovVerb.addEventListener('change', () => {
            const selectedVerb = sovVerb.options[sovVerb.selectedIndex];
            const verbType = selectedVerb.dataset.type;
            
            if (verbType === 'intransitive') {
                document.querySelector('.object-option[data-type="person"]').click();
                personObjectSection.classList.add('hidden');
                thingObjectSection.classList.add('hidden');
                document.querySelector('.object-options').classList.add('hidden');
            } else {
                document.querySelector('.object-options').classList.remove('hidden');
                if (currentObjectType === 'person') {
                    personObjectSection.classList.remove('hidden');
                } else {
                    thingObjectSection.classList.remove('hidden');
                }
            }
            
            updateSentence();
        });
        
        // 文章を生成
        function updateSentence() {
            let subJp, subEn;
            let compJp, compEn;
            let objJp = '', objEn = '';
            
            // 主語の取得
            if (currentSubjectType === 'proper') {
                subJp = customSubject.value.trim() || '___';
                subEn = customSubject.value.trim() || '___';
            } else {
                const [jp, , en] = subject.value.split('/');
                subJp = jp;
                subEn = en;
            }
            
            // 補語の取得 (SCV文型の場合)
            if (currentSentenceType === 'scv') {
                if (currentComplementType === 'adjective') {
                    if (customAdjective.value.trim() !== '') {
                        compJp = customAdjective.value.trim();
                        compEn = customAdjective.value.trim();
                    } else {
                        const [adjJp, , adjEn] = adjectiveComplement.value.split('/');
                        compJp = adjJp;
                        compEn = adjEn;
                    }
                } else {
                    compJp = customNounComplement.value.trim() || '___';
                    compEn = customNounComplement.value.trim() || '___';
                }
            }
            
            // 目的語の取得 (SOV文型の場合)
            if (currentSentenceType === 'sov') {
                const selectedVerb = sovVerb.options[sovVerb.selectedIndex];
                const verbType = selectedVerb.dataset.type;
                
                if (verbType !== 'intransitive') {
                    if (currentObjectType === 'person') {
                        if (customPersonObject.value.trim() !== '') {
                            objJp = customPersonObject.value.trim();
                            objEn = customPersonObject.value.trim();
                        } else {
                            const [jp, , en] = personObject.value.split('/');
                            objJp = jp;
                            objEn = en;
                        }
                    } else {
                        if (customThingObject.value.trim() !== '') {
                            objJp = customThingObject.value.trim();
                            objEn = customThingObject.value.trim();
                        } else {
                            const [jp, , en] = thingObject.value.split('/');
                            objJp = jp;
                            objEn = en;
                        }
                    }
                }
            }
            
            let sentenceJp = '';
            let sentenceEn = '';
            
            if (currentSentenceType === 'scv') {
                const selectedVerbOption = scvVerb.options[scvVerb.selectedIndex];
                const verbType = selectedVerbOption.dataset.type;
                const [verbJp, , verbEn] = scvVerb.value.split('/');
                
                // 日本語文の生成
                sentenceJp = `${subJp}<span class="particle">は</span> ${compJp}${verbJp}`;
                
                // 英語訳の生成
                if (currentComplementType === 'adjective') {
                    if (verbType === 'question') {
                        sentenceEn = `${verbEn} ${subEn.toLowerCase()} ${compEn}?`;
                    } else {
                        sentenceEn = `${subEn} ${verbEn} ${compEn}`;
                    }
                } else {
                    if (verbType === 'question') {
                        sentenceEn = `${verbEn} ${subEn.toLowerCase()} a ${compEn}?`;
                    } else {
                        sentenceEn = `${subEn} ${verbEn} a ${compEn}`;
                    }
                }
            } else {
                const [verbJp, , verbEn] = sovVerb.value.split('/');
                const selectedVerb = sovVerb.options[sovVerb.selectedIndex];
                const verbType = selectedVerb.dataset.type;
                
                if (verbType === 'intransitive') {
                    sentenceJp = `${subJp}<span class="particle">は</span> ${verbJp}`;
                    sentenceEn = `${subEn} ${verbEn}`;
                } else {
                    sentenceJp = `${subJp}<span class="particle">は</span> ${objJp}<span class="particle">を</span> ${verbJp}`;
                    sentenceEn = `${subEn} ${verbEn} ${objEn}`;
                }
            }
            
            if (englishMode) {
                japanese.innerHTML = sentenceEn;
                english.textContent = '';
            } else {
                japanese.innerHTML = sentenceJp;
                english.textContent = sentenceEn;
            }
        }
        
        // 初期表示 (過去形を選択)
        document.querySelector('.tense-option[data-tense="past"]').click();
        updateSentence();
    </script>
</body>
</html>
