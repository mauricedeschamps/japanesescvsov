<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Sentence Maker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='red'/></svg>">
    <style>
        :root {
            --bg: #121212;
            --text: #e0e0e0;
            --card: #1e1e1e;
            --border: #444;
            --primary: #4CAF50;
            --secondary: #2196F3;
            --accent: #FF9800;
            --particle: #FF5252;
        }
        .light-mode {
            --bg: #ffffff;
            --text: #333333;
            --card: #f8f9fa;
            --border: #dee2e6;
            --primary: #007bff;
            --secondary: #6c757d;
            --accent: #fd7e14;
            --particle: #dc3545;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 10px;
            line-height: 1.6;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 60px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 1.5rem;
            margin: 0;
            color: var(--primary);
        }
        .controls {
            display: flex;
            gap: 10px;
        }
        button {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            color: var(--text);
            transition: all 0.3s;
        }
        .mode-toggle {
            background: var(--primary);
            color: white;
        }
        .builder {
            background: var(--card);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            transition: all 0.3s;
        }
        select, input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--card);
            color: var(--text);
            transition: all 0.3s;
        }
        .sentence-type {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }
        .sentence-type button {
            flex: 1;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            padding: 8px;
            color: var(--text);
            cursor: pointer;
        }
        .sentence-type button.active {
            border-bottom: 2px solid var(--accent);
            font-weight: bold;
            color: var(--accent);
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: var(--card);
            border-radius: 8px;
            min-height: 100px;
            border: 1px solid var(--border);
            transition: all 0.3s;
        }
        .japanese {
            font-size: 1.2rem;
            margin-bottom: 5px;
            color: var(--text);
            line-height: 1.8;
        }
        .japanese .particle {
            color: var(--particle);
            font-weight: bold;
        }
        .english {
            color: var(--secondary);
            font-style: italic;
        }
        .hidden {
            display: none;
        }
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card);
            padding: 10px;
            text-align: center;
            border-top: 1px solid var(--border);
            font-size: 0.8rem;
            transition: all 0.3s;
        }
        .footer a {
            color: var(--primary);
            text-decoration: none;
        }
        .subject-options, .complement-options {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .subject-option, .complement-option {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            background: var(--card);
            border: 1px solid var(--border);
            transition: all 0.3s;
        }
        .subject-option.selected, .complement-option.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .adjective-space {
            margin-right: 5px;
        }
        .custom-input {
            margin-top: 10px;
        }
        .custom-input label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Japanese Sentence Maker</h1>
            <div class="controls">
                <button class="mode-toggle" id="darkMode">Light</button>
                <button id="langToggle">EN</button>
            </div>
        </div>
        
        <div class="sentence-type">
            <button class="active" data-type="scv">SはCです</button>
            <button data-type="sov">SはOをV</button>
        </div>
        
        <div class="builder">
            <!-- Subject Section -->
            <div class="subject-options">
                <div class="subject-option selected" data-type="proper">Proper Noun</div>
                <div class="subject-option" data-type="pronoun">Pronoun</div>
            </div>
            
            <div id="proper-noun-section">
                <div class="custom-input">
                    <label for="customSubject">Enter proper noun:</label>
                    <input type="text" id="customSubject" placeholder="e.g. たなか">
                </div>
            </div>
            
            <div id="pronoun-section" class="hidden">
                <select id="subject">
                    <option value="わたし/watashi/I">わたし (I)</option>
                    <option value="あなた/anata/You">あなた (You)</option>
                    <option value="かれ/kare/He">かれ (He)</option>
                    <option value="かのじょ/kanojo/She">かのじょ (She)</option>
                    <option value="わたしたち/watashitachi/We">わたしたち (We)</option>
                    <option value="あなたたち/anatatachi/You (plural)">あなたたち (You all)</option>
                    <option value="かれら/karera/They (male)">かれら (They - male)</option>
                    <option value="かのじょら/kanojora/They (female)">かのじょら (They - female)</option>
                    <option value="これ/kore/This">これ (This)</option>
                    <option value="それ/sore/That">それ (That)</option>
                    <option value="あれ/are/That (over there)">あれ (That over there)</option>
                </select>
            </div>
            
            <!-- Complement Section -->
            <div id="complement-section">
                <div class="complement-options">
                    <div class="complement-option selected" data-type="adjective">Adjective</div>
                    <div class="complement-option" data-type="noun">Noun</div>
                </div>
                
                <div id="adjective-complement-section">
                    <select id="adjective-complement">
                        <option value="うれしい/ureshii/happy">うれしい (happy)</option>
                        <option value="かなしい/kanashii/sad">かなしい (sad)</option>
                        <option value="たのしい/tanoshii/fun">たのしい (fun)</option>
                        <option value="おいしい/oishii/delicious">おいしい (delicious)</option>
                        <option value="げんき/genki/energetic">げんき (energetic)</option>
                        <option value="いい/ii/good">いい (good)</option>
                        <option value="わるい/warui/bad">わるい (bad)</option>
                        <option value="おおきい/ookii/big">おおきい (big)</option>
                        <option value="ちいさい/chiisai/small">ちいさい (small)</option>
                        <option value="たかい/takai/expensive">たかい (expensive)</option>
                        <option value="やすい/yasui/cheap">やすい (cheap)</option>
                        <option value="ながい/nagai/long">ながい (long)</option>
                        <option value="みじかい/mijikai/short">みじかい (short)</option>
                        <option value="はやい/hayai/fast">はやい (fast)</option>
                        <option value="おそい/osoi/slow">おそい (slow)</option>
                        <option value="あつい/atsui/hot">あつい (hot)</option>
                        <option value="さむい/samui/cold">さむい (cold)</option>
                        <option value="むずかしい/muzukashii/difficult">むずかしい (difficult)</option>
                        <option value="やさしい/yasashii/easy">やさしい (easy)</option>
                        <option value="おもしろい/omoshiroi/interesting">おもしろい (interesting)</option>
                    </select>
                </div>
                
                <div id="noun-complement-section" class="hidden">
                    <div class="custom-input">
                        <label for="customNounComplement">Enter noun:</label>
                        <input type="text" id="customNounComplement" placeholder="e.g. がくせい">
                    </div>
                </div>
            </div>
            
            <div id="object-section" class="hidden">
                <select id="object">
                    <option value="ほん/hon/book">ほん (book)</option>
                    <option value="りんご/ringo/apple">りんご (apple)</option>
                    <option value="みず/mizu/water">みず (water)</option>
                    <option value="ケーキ/keeki/cake">ケーキ (cake)</option>
                    <option value="スマホ/sumaho/smartphone">スマホ (smartphone)</option>
                </select>
            </div>
            
            <div id="verb-section">
                <select id="scv-verb">
                    <option value="です/desu/am/is/are">です (am/is/are)</option>
                    <option value="ではありません/dewa arimasen/am not/is not/are not">ではありません (am not/is not/are not)</option>
                    <option value="ですか/desu ka/am/is/are">ですか？ (am/is/are?)</option>
                </select>
                
                <select id="sov-verb" class="hidden">
                    <option value="よみます/yomimasu/read">よみます (read)</option>
                    <option value="たべます/tabemasu/eat">たべます (eat)</option>
                    <option value="のみます/nomimasu/drink">のみます (drink)</option>
                    <option value="かいます/kaimasu/buy">かいます (buy)</option>
                    <option value="つくります/tsukurimasu/make">つくります (make)</option>
                    <option value="みます/mimasu/watch">みます (watch)</option>
                    <option value="ききます/kikimasu/listen">ききます (listen)</option>
                    <option value="かきます/kakimasu/write">かきます (write)</option>
                    <option value="はなします/hanashimasu/speak">はなします (speak)</option>
                    <option value="いきます/ikimasu/go">いきます (go)</option>
                    <option value="きます/kimasu/come">きます (come)</option>
                    <option value="ねます/nemasu/sleep">ねます (sleep)</option>
                    <option value="おきます/okimasu/wake up">おきます (wake up)</option>
                    <option value="べんきょうします/benkyou shimasu/study">べんきょうします (study)</option>
                    <option value="しごとします/shigoto shimasu/work">しごとします (work)</option>
                </select>
            </div>
        </div>
        
        <div class="result">
            <div class="japanese" id="japanese"></div>
            <div class="english" id="english"></div>
        </div>
    </div>

    <div class="footer">
        Contact us<br>
        <a href="mailto:mementomorikatsu@gmail.com">mementomorikatsu@gmail.com</a>
    </div>

    <script>
        // 要素を取得
        const darkBtn = document.getElementById('darkMode');
        const langBtn = document.getElementById('langToggle');
        const sentenceTypeBtns = document.querySelectorAll('.sentence-type button');
        const subjectOptions = document.querySelectorAll('.subject-option');
        const complementOptions = document.querySelectorAll('.complement-option');
        const subject = document.getElementById('subject');
        const customSubject = document.getElementById('customSubject');
        const adjectiveComplement = document.getElementById('adjective-complement');
        const customNounComplement = document.getElementById('customNounComplement');
        const object = document.getElementById('object');
        const scvVerb = document.getElementById('scv-verb');
        const sovVerb = document.getElementById('sov-verb');
        const properNounSection = document.getElementById('proper-noun-section');
        const pronounSection = document.getElementById('pronoun-section');
        const adjectiveComplementSection = document.getElementById('adjective-complement-section');
        const nounComplementSection = document.getElementById('noun-complement-section');
        const complementSection = document.getElementById('complement-section');
        const objectSection = document.getElementById('object-section');
        const japanese = document.getElementById('japanese');
        const english = document.getElementById('english');
        const body = document.body;
        
        // 初期設定
        let englishMode = false;
        let currentSentenceType = 'scv';
        let currentSubjectType = 'proper';
        let currentComplementType = 'adjective';
        
        // ダークモード切り替え
        darkBtn.addEventListener('click', () => {
            body.classList.toggle('light-mode');
            const isLight = body.classList.contains('light-mode');
            darkBtn.textContent = isLight ? 'Dark' : 'Light';
        });
        
        // 言語切り替え
        langBtn.addEventListener('click', () => {
            englishMode = !englishMode;
            langBtn.textContent = englishMode ? 'JP' : 'EN';
            updateSentence();
        });
        
        // 文型切り替え
        sentenceTypeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                sentenceTypeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSentenceType = btn.dataset.type;
                
                if (currentSentenceType === 'scv') {
                    complementSection.classList.remove('hidden');
                    objectSection.classList.add('hidden');
                    scvVerb.classList.remove('hidden');
                    sovVerb.classList.add('hidden');
                } else {
                    complementSection.classList.add('hidden');
                    objectSection.classList.remove('hidden');
                    scvVerb.classList.add('hidden');
                    sovVerb.classList.remove('hidden');
                }
                
                updateSentence();
            });
        });
        
        // 主語タイプ切り替え
        subjectOptions.forEach(option => {
            option.addEventListener('click', () => {
                subjectOptions.forEach(opt => opt.classList.remove('selected'));
                option.classList.add('selected');
                currentSubjectType = option.dataset.type;
                
                if (currentSubjectType === 'proper') {
                    properNounSection.classList.remove('hidden');
                    pronounSection.classList.add('hidden');
                } else {
                    properNounSection.classList.add('hidden');
                    pronounSection.classList.remove('hidden');
                }
                
                updateSentence();
            });
        });
        
        // 補語タイプ切り替え
        complementOptions.forEach(option => {
            option.addEventListener('click', () => {
                complementOptions.forEach(opt => opt.classList.remove('selected'));
                option.classList.add('selected');
                currentComplementType = option.dataset.type;
                
                if (currentComplementType === 'adjective') {
                    adjectiveComplementSection.classList.remove('hidden');
                    nounComplementSection.classList.add('hidden');
                } else {
                    adjectiveComplementSection.classList.add('hidden');
                    nounComplementSection.classList.remove('hidden');
                }
                
                updateSentence();
            });
        });
        
        // 文章を生成
        function updateSentence() {
            let subJp, subEn;
            let compJp, compEn;
            
            // 主語の取得
            if (currentSubjectType === 'proper') {
                subJp = customSubject.value.trim() || '___';
                subEn = customSubject.value.trim() || '___';
            } else {
                const [jp, , en] = subject.value.split('/');
                subJp = jp;
                subEn = en;
            }
            
            // 補語の取得
            if (currentComplementType === 'adjective') {
                const [adjJp, , adjEn] = adjectiveComplement.value.split('/');
                compJp = adjJp;
                compEn = adjEn;
            } else {
                compJp = customNounComplement.value.trim() || '___';
                compEn = customNounComplement.value.trim() || '___';
            }
            
            let sentenceJp = '';
            let sentenceEn = '';
            
            if (currentSentenceType === 'scv') {
                const [verbJp, , verbEn] = scvVerb.value.split('/');
                
                // 形容詞/名詞と「です」の間にスペースを追加
                sentenceJp = `${subJp}<span class="particle">は</span> ${compJp}<span class="adjective-space"> </span>${verbJp}`;
                
                // 英語訳の生成
                if (currentComplementType === 'adjective') {
                    sentenceEn = `${subEn} ${verbEn.replace('am', 'am').replace('are', 'are')} ${compEn}`;
                    if (verbJp.includes('か')) {
                        sentenceEn = `${verbEn.replace('am', 'Are').replace('are', 'Are')} ${subEn.toLowerCase()} ${compEn}?`;
                    }
                } else {
                    sentenceEn = `${subEn} ${verbEn.replace('am', 'am').replace('are', 'are')} a ${compEn}`;
                    if (verbJp.includes('か')) {
                        sentenceEn = `${verbEn.replace('am', 'Are').replace('are', 'Are')} ${subEn.toLowerCase()} a ${compEn}?`;
                    }
                }
            } else {
                const [objJp, , objEn] = object.value.split('/');
                const [verbJp, , verbEn] = sovVerb.value.split('/');
                
                sentenceJp = `${subJp}<span class="particle">は</span> ${objJp}<span class="particle">を</span> ${verbJp}`;
                sentenceEn = `${subEn} ${verbEn} ${objEn}`;
            }
            
            if (englishMode) {
                japanese.innerHTML = sentenceEn;
                english.textContent = '';
            } else {
                japanese.innerHTML = sentenceJp;
                english.textContent = sentenceEn;
            }
        }
        
        // 入力変更時のイベント
        [subject, adjectiveComplement, customSubject, customNounComplement, object, scvVerb, sovVerb].forEach(el => {
            el.addEventListener('input', updateSentence);
            el.addEventListener('change', updateSentence);
        });
        
        // 初期表示
        updateSentence();
    </script>
</body>
</html>
